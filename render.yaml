services:
  - type: web
    name: yeeyuan
    runtime: static
    repo: https://github.com/tsrirang-jpg/yeeyuan
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://yeeyuan-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SERVER_APP_URL
        value: https://yeeyuan-app.onrender.com
      - key: NEXT_PUBLIC_LEGACY_FRONTEND_ORIGIN
        value: https://yeeyuan.onrender.com

  - type: web
    name: yeeyuan-app
    runtime: node
    repo: https://github.com/tsrirang-jpg/yeeyuan
    branch: main
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_DEPLOYMENT_MODE
        value: server
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: API_PROXY_TARGET
        value: https://yeeyuan-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SERVER_APP_URL
        value: https://yeeyuan-app.onrender.com
      - key: NEXT_PUBLIC_LEGACY_FRONTEND_ORIGIN
        value: https://yeeyuan.onrender.com

  - type: web
    name: yeeyuan-api
    runtime: docker
    repo: https://github.com/tsrirang-jpg/yeeyuan
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: local
      - key: MOCK_PAYMENTS
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://yeeyuan.onrender.com,https://yeeyuan-app.onrender.com
      - key: PUBLIC_APP_URL
        value: https://yeeyuan.onrender.com
      - key: API_BASE_URL
        value: https://yeeyuan-api.onrender.com/api/v1
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: gameqa
      - key: BOOTSTRAP_ADMIN_ROLE
        value: MANAGER
      - key: DB_HOST
        fromDatabase:
          name: yeeyuan-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: yeeyuan-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: yeeyuan-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: yeeyuan-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: yeeyuan-db
          property: password
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: yeeyuan-db
    databaseName: yeeyuan_db
    user: yeeyuan_db_user
    region: singapore
    plan: free
    postgresMajorVersion: "17"
