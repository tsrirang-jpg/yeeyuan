services:
  - type: web
    name: yeeyuan
    runtime: static
    repo: https://github.com/tsrirang-jpg/yeeyuan
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://yeeyuan-api.onrender.com/api/v1

  - type: web
    name: yeeyuan-api
    runtime: docker
    repo: https://github.com/tsrirang-jpg/yeeyuan
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: local
      - key: MOCK_PAYMENTS
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://yeeyuan.onrender.com
      - key: PUBLIC_APP_URL
        value: https://yeeyuan.onrender.com
      - key: API_BASE_URL
        value: https://yeeyuan-api.onrender.com/api/v1
      - key: DB_HOST
        fromDatabase:
          name: yeeyuan-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: yeeyuan-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: yeeyuan-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: yeeyuan-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: yeeyuan-db
          property: password
      - key: DATA_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: yeeyuan-db
    databaseName: yeeyuan_db
    user: yeeyuan_db_user
    region: singapore
    plan: free
    postgresMajorVersion: "17"
