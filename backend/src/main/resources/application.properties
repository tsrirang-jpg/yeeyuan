server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yeeyuan}}
spring.datasource.username=${DATABASE_USERNAME:yeeyuan}
spring.datasource.password=${DATABASE_PASSWORD:local-postgres-only}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
shop.environment=${APP_ENV:production}
shop.mock-payments=${MOCK_PAYMENTS:false}
shop.secure-cookies=${SECURE_COOKIES:true}
shop.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
shop.public-app-url=${PUBLIC_APP_URL:http://localhost:3000}
shop.api-base-url=${API_BASE_URL:http://localhost:8080/api/v1}
shop.encryption-key=${DATA_ENCRYPTION_KEY:}
shop.admin-username=${BOOTSTRAP_ADMIN_USERNAME:owner}
shop.admin-role=${BOOTSTRAP_ADMIN_ROLE:OWNER}
shop.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
shop.admin-totp-secret=${BOOTSTRAP_ADMIN_TOTP_SECRET:}
shop.omise-secret-key=${OMISE_SECRET_KEY:}
shop.omise-webhook-secret=${OMISE_WEBHOOK_SECRET:}
shop.omise-api-version=${OMISE_API_VERSION:2019-05-29}
shop.line-login-channel-id=${LINE_LOGIN_CHANNEL_ID:}
shop.line-channel-secret=${LINE_CHANNEL_SECRET:}
shop.line-channel-access-token=${LINE_CHANNEL_ACCESS_TOKEN:}
